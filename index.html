<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IIDE Horarios">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3E1832">
<style>
  :root{
    --plum:#3E1832;
    --plum-2:#5A2548;
    --paper:#F6F1EC;
    --paper-2:#EFE6DC;
    --orange:#DD8A3E;
    --orange-2:#C97327;
    --teal:#7FB4B4;
    --teal-2:#4E8A8A;
    --ink:#2B1420;
    --ink-soft:#6B5560;
    --line:#DDD0C4;
    --white:#FFFDFB;
    --now:#D64A3A;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .display{font-family:Georgia,'Iowan Old Style','Palatino Linotype',serif;}

  /* Header */
  header{
    background:var(--plum);
    color:var(--paper);
    padding:22px 18px 20px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
  }
  .brand{display:flex; align-items:center; gap:14px;}
  .seal{width:52px; height:52px; flex:0 0 auto; border-radius:50%; object-fit:cover; box-shadow:0 0 0 2px rgba(246,241,236,.15);}
  .brand-text h1{
    font-size:17px; margin:0; line-height:1.15; letter-spacing:.2px;
  }
  .brand-text .sub{
    font-size:11px; color:var(--teal); letter-spacing:1.5px; text-transform:uppercase; margin-top:3px;
  }

  /* Tabs */
  .tabbar{
    display:flex; gap:8px; overflow-x:auto; padding:14px 16px 0; scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .pill{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    display:flex; align-items:center; gap:6px;
  }
  .pill.active{
    background:var(--orange);
    border-color:var(--orange-2);
    color:#fff;
  }
  .pill.ghost{
    background:transparent;
    border-style:dashed;
    color:var(--ink-soft);
  }
  .pill.small{padding:6px 11px; font-size:12.5px;}
  .pill.teal.active{background:var(--teal-2); border-color:var(--teal-2);}

  main{padding:16px; padding-bottom:100px; max-width:900px; margin:0 auto;}

  .year-meta{
    display:flex; align-items:baseline; justify-content:space-between;
    margin:6px 2px 14px;
  }
  .year-meta h2{
    font-size:19px; margin:0; font-weight:700;
  }
  .year-meta .cohort{
    font-size:12px; color:var(--ink-soft); font-variant-numeric:tabular-nums;
  }

  /* Schedule grid */
  .grid-wrap{
    overflow-x:auto;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--white);
  }
  table.grid{
    border-collapse:collapse;
    width:100%;
    min-width:640px;
  }
  table.grid th, table.grid td{
    border:1px solid var(--line);
  }
  table.grid thead th{
    background:var(--plum);
    color:var(--paper);
    font-size:11.5px;
    text-transform:uppercase;
    letter-spacing:.8px;
    padding:10px 6px;
    position:sticky; top:0;
  }
  table.grid thead th:first-child{
    background:var(--plum-2);
  }
  .hora-cell{
    background:var(--paper-2);
    padding:8px 8px;
    font-size:11.5px;
    font-weight:700;
    color:var(--plum);
    width:98px;
    white-space:nowrap;
    vertical-align:top;
  }
  .hora-cell .rango{
    display:block; font-weight:400; color:var(--ink-soft); font-size:10.5px; margin-top:2px;
  }
  .hora-actions{margin-top:6px; display:flex; gap:4px;}
  .mini-btn{
    border:none; background:none; color:var(--ink-soft); font-size:13px; padding:2px 4px; border-radius:6px;
  }
  .mini-btn:active{background:var(--line);}

  td.clase-cell{
    padding:0;
    vertical-align:top;
    min-width:110px;
    height:64px;
  }
  .clase-btn{
    width:100%; height:100%;
    border:none; background:transparent;
    padding:8px 7px;
    text-align:left;
    display:flex; flex-direction:column; justify-content:center;
    gap:2px;
    cursor:pointer;
  }
  .clase-btn .materia{
    font-size:13px; font-weight:800; color:var(--plum-2); line-height:1.22;
  }
  .clase-btn .profesor{
    font-size:11.5px; color:var(--ink-soft); font-weight:600;
  }
  .clase-btn .aula{
    font-size:11px; color:var(--teal-2); font-weight:700; margin-top:2px;
  }
  .clase-btn.empty{
    color:var(--line);
    font-size:18px;
    align-items:center; justify-content:center;
  }
  .clase-btn.empty:active, td.clase-cell:active .clase-btn{
    background:var(--paper-2);
  }
  td.clase-cell{position:relative;}
  .now-ring{
    position:absolute; inset:3px;
    border:2.5px solid var(--now);
    border-radius:9px;
    pointer-events:none;
    animation:pulseRing 1.6s ease-in-out infinite;
  }
  .now-tag{
    position:absolute; top:2px; right:2px;
    background:var(--now); color:#fff;
    font-size:8.5px; font-weight:800; letter-spacing:.4px;
    padding:2px 5px; border-radius:6px;
    z-index:2;
  }
  @keyframes pulseRing{
    0%,100%{ box-shadow:0 0 0 0 rgba(214,74,58,.35); }
    50%{ box-shadow:0 0 0 5px rgba(214,74,58,0); }
  }

  .add-row-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%;
    padding:12px;
    background:var(--white);
    border:1px dashed var(--line);
    border-radius:var(--radius);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:600;
    margin-top:10px;
  }

  .section-title{
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1.2px;
    color:var(--ink-soft);
    margin:26px 2px 8px;
    font-weight:700;
  }

  /* Sheet / modal */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(30,12,22,.45);
    display:none; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet-backdrop.open{display:flex;}
  .sheet{
    background:var(--white);
    width:100%; max-width:520px;
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto;
    animation:slideup .18s ease-out;
  }
  @keyframes slideup{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{
    width:38px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;
  }
  .sheet h3{margin:0 0 2px; font-size:17px;}
  .sheet .sheet-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.6px; color:var(--ink-soft); margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:11px 12px;
    font-size:16px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--paper);
    color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--orange); outline-offset:1px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  .sheet-actions{display:flex; gap:10px; margin-top:18px;}
  .btn{
    flex:1;
    padding:13px;
    border-radius:10px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{background:var(--orange); color:#fff;}
  .btn-primary:active{background:var(--orange-2);}
  .btn-danger{background:#F4E4E0; color:#A23B2E;}
  .btn-danger:active{background:#EAD0C9;}
  .btn-ghost{background:var(--paper-2); color:var(--ink);}
  .btn-ghost:active{background:var(--line);}

  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%);
    background:var(--plum); color:var(--paper);
    padding:10px 18px; border-radius:999px; font-size:13px;
    opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:60;
  }
  .toast.show{opacity:1;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .seal{width:56px; height:56px; margin:0 auto 14px; opacity:.5;}

  .loading{text-align:center; padding:60px; color:var(--ink-soft); font-size:13px;}

  /* view toggle */
  .view-toggle{
    display:flex; gap:8px; padding:14px 16px 0;
  }
  .view-btn{
    flex:1;
    padding:10px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    font-size:13px;
    font-weight:700;
  }
  .view-btn.active{
    background:var(--plum);
    color:var(--paper);
    border-color:var(--plum);
  }

  .aula-manage-link{
    display:block; text-align:center; font-size:12px; color:var(--teal-2);
    font-weight:700; margin:12px 2px 0; text-decoration:underline;
  }

  .aula-day-group{margin-bottom:18px;}
  .aula-day-group h3{
    font-size:13px; text-transform:uppercase; letter-spacing:1px;
    color:var(--plum); margin:0 0 8px 2px;
  }
  .aula-entry{
    background:var(--white); border:1px solid var(--line); border-radius:12px;
    padding:11px 13px; margin-bottom:8px;
    display:flex; justify-content:space-between; gap:10px; align-items:center;
  }
  .aula-entry.conflict{border-color:#C94B36; background:#FBEDEA;}
  .aula-entry .info .time{font-size:11.5px; color:var(--ink-soft); font-weight:700;}
  .aula-entry .info .mat{font-size:13.5px; font-weight:700; color:var(--plum-2); margin-top:2px;}
  .aula-entry .info .meta{font-size:11.5px; color:var(--ink-soft); margin-top:1px;}
  .aula-entry .warn{font-size:11px; color:#C94B36; font-weight:700; white-space:nowrap;}

  .manage-list-item{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 4px; border-bottom:1px solid var(--line);
  }
  .manage-list-item span{font-size:14px;}
  .manage-list-item button{
    border:none; background:none; color:#C94B36; font-size:13px; font-weight:700; padding:4px 8px;
  }

  /* día view */
  .dia-carrera-group{margin-bottom:26px;}
  .dia-carrera-group h3{
    font-size:15px; text-transform:uppercase; letter-spacing:1px;
    color:var(--plum); margin:0 0 10px 2px; font-weight:800;
    display:flex; align-items:center; gap:8px;
  }
  .dia-carrera-group .anio-label{
    font-size:12.5px; color:var(--ink-soft); margin:14px 2px 8px; font-weight:800;
    text-transform:uppercase; letter-spacing:.5px;
  }
  .clase-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 15px;
    margin-bottom:10px;
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    box-shadow:0 1px 3px rgba(43,20,32,.05);
  }
  .clase-card .info{flex:1; min-width:0;}
  .clase-card .time{font-size:13px; color:var(--ink-soft); font-weight:800; display:flex; align-items:center; gap:5px;}
  .clase-card .mat{
    font-size:16.5px; font-weight:800; margin-top:4px; line-height:1.25;
  }
  .clase-card .meta{font-size:13px; color:var(--ink); margin-top:6px; display:flex; align-items:center; gap:5px; font-weight:600;}
  .aula-chip{
    display:inline-flex; align-items:center; gap:5px;
    margin-top:8px;
    padding:6px 11px;
    border-radius:999px;
    background:var(--paper-2);
    border:1.5px dashed var(--teal-2);
    color:var(--teal-2);
    font-size:12.5px;
    font-weight:800;
  }
  .aula-chip.sin-asignar{
    border-style:dashed; color:#A34A2E; border-color:#A34A2E; background:#FBEDE6;
  }
  .edit-aula-btn{
    flex:0 0 auto;
    border:none;
    background:var(--plum);
    color:#fff;
    font-size:12.5px;
    font-weight:800;
    padding:11px 13px;
    border-radius:11px;
    min-height:44px;
  }
  .edit-aula-btn:active{background:var(--plum-2);}

  /* avatar + color coding for accesibilidad visual */
  .avatar{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; font-weight:800; color:#fff;
    flex:0 0 auto;
  }
  .clase-card{align-items:flex-start; gap:12px;}
  .clase-card .avatar-col{display:flex; flex-direction:column; align-items:center; gap:6px; flex:0 0 auto;}
  .now-badge{
    display:inline-flex; align-items:center; gap:4px;
    background:var(--now); color:#fff; font-size:10.5px; font-weight:800;
    padding:3px 8px; border-radius:999px; letter-spacing:.3px;
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  .now-badge .dot{width:6px; height:6px; border-radius:50%; background:#fff; display:inline-block;}
  @keyframes pulseDot{
    0%,100%{ opacity:1; } 50%{ opacity:.55; }
  }
  .clase-card.is-now{
    border-width:2px;
    box-shadow:0 0 0 3px rgba(214,74,58,.14);
  }
  .materia-bar{
    width:6px; align-self:stretch; border-radius:6px; flex:0 0 auto;
  }
  .clase-card{padding:12px 13px 12px 10px;}
  .clase-card > .materia-bar + .info{padding-left:2px;}

  .legend{
    display:flex; flex-wrap:wrap; gap:8px;
    margin:2px 2px 16px;
  }
  .legend-chip{
    display:flex; align-items:center; gap:6px;
    font-size:11px; font-weight:700; color:var(--ink-soft);
    background:var(--white); border:1px solid var(--line);
    padding:5px 10px; border-radius:999px;
  }
  .legend-chip .sw{width:11px; height:11px; border-radius:4px; flex:0 0 auto;}
</style>
</head>

  function toast(msg){

  async function saveData(){
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state.data));
    }catch(e){
      console.error('Error guardando', e);
      toast('No se pudo guardar');
    }
  }

  async function loadData(){
    try{
      var res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){
        state.data = JSON.parse(res.value);
      }else{
        state.data = defaultData();
        await saveData();
      }
    }catch(e){
      state.data = defaultData();
    }
    // migración: si venís de una versión anterior sin lista de aulas, la agregamos
    if(!state.data.aulas){
      state.data.aulas = ['Aula 2/3','Laboratorio','Sum','Biblioteca','Aula P1','Aula P2','Aula Anexo P1','Aula Anexo P2'];
    }
    // migración: actualizar horario de Analista de Sistemas con la última versión del Excel
    if((state.data._version || 1) < DATA_VERSION){
      var fresh = defaultData();
      var freshSistemas = fresh.carreras.find(function(c){ return c.nombre === 'Analista de Sistemas'; });
      var idx = state.data.carreras.findIndex(function(c){ return c.nombre === 'Analista de Sistemas'; });
      if(freshSistemas && idx !== -1){
        state.data.carreras[idx] = freshSistemas;
      }
      state.data._version = DATA_VERSION;
      await saveData();
      toast('Horario de Analista de Sistemas actualizado');
    }
    state.view = 'dia';
    state.diaSel = hoyDiaName();
    state.carreraId = state.data.carreras[0].id;
    state.anioId = state.data.carreras[0].años[0].id;
    state.aulaSel = state.data.aulas[0] || null;
    render();
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  var MATERIA_PALETTE = [
    {bg:'#FBEAD1', border:'#C97327', text:'#8A4E15'},

    {bg:'#EDE3D6', border:'#8A6A45', text:'#5C4830'}
  ];
  function hashStr(s){
    var h = 0;
    s = String(s||'');
    for(var i=0; i<s.length; i++){ h = (h*31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  function materiaStyle(materia){
    if(!materia) return {bg:'#EFE6DC', border:'#DDD0C4', text:'#6B5560'};
    return MATERIA_PALETTE[hashStr(materia) % MATERIA_PALETTE.length];
  }
  var AVATAR_COLORS = ['#4E8A8A','#C97327','#B5477A','#5A5FBE','#3D8F55','#7A4FBE','#2E8FB0','#8A6A45'];
  function avatarColor(nombre){
    if(!nombre) return '#B9AAB2';
    return AVATAR_COLORS[hashStr(nombre) % AVATAR_COLORS.length];
  }
  function avatarInicial(nombre){
    if(!nombre) return '?';
    return nombre.trim().charAt(0).toUpperCase();
  }
  var AULA_ICONS = {
    'laboratorio':'💻','sum':'🔊','biblioteca':'📚'
  };
  function aulaIcon(aula){
    if(!aula) return '❔';
    var key = aula.toLowerCase();
    for(var k in AULA_ICONS){ if(key.indexOf(k) !== -1) return AULA_ICONS[k]; }
    return '🚪';
  }
  function isNow(hora, dia){
    if(dia !== hoyDiaName()) return false;
    var now = new Date();
    var mins = now.getHours()*60 + now.getMinutes();
    var ini = timeToMin(hora.inicio), fin = timeToMin(hora.fin);
    if(ini===null || fin===null) return false;
    return mins >= ini && mins < fin;
  }

      renderCarreraTabs();

      document.getElementById('carreraTabs').innerHTML = '';
      document.getElementById('anioTabs').innerHTML = '';
      renderAulaView();
    }else{
      document.getElementById('carreraTabs').innerHTML = '';
      document.getElementById('anioTabs').innerHTML = '';
      renderDiaView();
    }
  }

  function timeToMin(t){
    if(!t || t.indexOf(':') === -1) return null;
    var p = t.split(':');
    return parseInt(p[0],10)*60 + parseInt(p[1],10);
  }
  function overlap(aStart,aEnd,bStart,bEnd){
    var as=timeToMin(aStart), ae=timeToMin(aEnd), bs=timeToMin(bStart), be=timeToMin(bEnd);
    if(as===null||ae===null||bs===null||be===null) return false;
    return as < be && bs < ae;
  }

    var anyEntries = false;

    state.data.carreras.forEach(function(carrera){
      var carreraHasEntries = carrera.años.some(function(anio){
        return anio.horas.some(function(hora){ return !!anio.clases[hora.id + '_' + state.diaSel]; });
      });
      if(!carreraHasEntries) return;
      anyEntries = true;

      var group = document.createElement('div');
      group.className = 'dia-carrera-group';
      var h3 = document.createElement('h3');
      h3.textContent = carrera.nombre;
      group.appendChild(h3);

      carrera.años.forEach(function(anio){
        var entries = [];
        anio.horas.forEach(function(hora){
          var key = hora.id + '_' + state.diaSel;
          var c = anio.clases[key];
          if(c && (c.materia || c.profesor)){
            entries.push({hora:hora, key:key, clase:c});
          }
        });
        if(!entries.length) return;
        entries.sort(function(a,b){ return (timeToMin(a.hora.inicio)||0) - (timeToMin(b.hora.inicio)||0); });

        var anioLabel = document.createElement('div');
        anioLabel.className = 'anio-label';
        anioLabel.textContent = anio.nombre + (anio.cohorte ? ' · Cohorte ' + anio.cohorte : '');
        group.appendChild(anioLabel);

        entries.forEach(function(e){
          var ms = materiaStyle(e.clase.materia);
          var nowActive = isNow(e.hora, state.diaSel);
          var card = document.createElement('div');
          card.className = 'clase-card' + (nowActive ? ' is-now' : '');
          card.style.borderColor = nowActive ? 'var(--now)' : 'var(--line)';

          var bar = document.createElement('div');
          bar.className = 'materia-bar';
          bar.style.background = ms.border;
          card.appendChild(bar);

          var avatarCol = document.createElement('div');
          avatarCol.className = 'avatar-col';
          var avatar = document.createElement('div');
          avatar.className = 'avatar';
          avatar.style.background = avatarColor(e.clase.profesor);
          avatar.textContent = avatarInicial(e.clase.profesor);
          avatarCol.appendChild(avatar);
          card.appendChild(avatarCol);

          var aulaChip = e.clase.aula
            ? '<span class="aula-chip">' + aulaIcon(e.clase.aula) + ' ' + escapeHtml(e.clase.aula) + '</span>'
            : '<span class="aula-chip sin-asignar">❔ Sin aula asignada</span>';
          var info = document.createElement('div');
          info.className = 'info';
          info.innerHTML =
            '<div class="time">' + e.hora.inicio + ' – ' + e.hora.fin + (nowActive ? ' &nbsp;<span class="now-badge"><span class="dot"></span>AHORA</span>' : '') + '</div>' +
            '<div class="mat" style="color:' + ms.text + '">' + escapeHtml(e.clase.materia || '(sin materia)') + '</div>' +
            '<div class="meta">' + (e.clase.profesor ? escapeHtml(e.clase.profesor) : 'Sin profesor asignado') + '</div>' +
            '<div>' + aulaChip + '</div>';
          card.appendChild(info);

          var editBtn = document.createElement('button');
          editBtn.className = 'edit-aula-btn';
          editBtn.textContent = '✏️ Aula';
          editBtn.onclick = function(){ openClaseSheet(carrera, anio, e.hora, state.diaSel, e.key); };
          card.appendChild(editBtn);
          group.appendChild(card);
        });
      });

      main.appendChild(group);
    });

    if(!anyEntries){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'No hay clases cargadas para ' + state.diaSel + '.';
      main.appendChild(empty);
    }
  }

  function renderAulaView(){
    var main = document.getElementById('main');
    main.innerHTML = '';

    if(!state.data.aulas.length){
      main.innerHTML = '<div class="empty-state">Todavía no cargaste ningún aula.</div>';
      var addA = document.createElement('button');
      addA.className = 'pill';
      addA.textContent = '+ Agregar aula';
      addA.onclick = openManageAulasSheet;
      main.appendChild(addA);
      return;
    }

    if(!state.aulaSel || state.data.aulas.indexOf(state.aulaSel) === -1){
      state.aulaSel = state.data.aulas[0];
    }

    var tabs = document.createElement('div');
    tabs.className = 'tabbar';
    tabs.style.padding = '0 0 4px';
    state.data.aulas.forEach(function(a){
      var b = document.createElement('button');
      b.className = 'pill small' + (a === state.aulaSel ? ' active' : '');
      b.textContent = a;
      b.onclick = function(){ state.aulaSel = a; render(); };
      tabs.appendChild(b);
    });
    main.appendChild(tabs);

    var manageLink = document.createElement('a');
    manageLink.href = 'javascript:void(0)';
    manageLink.className = 'aula-manage-link';
    manageLink.textContent = 'Gestionar lista de aulas';
    manageLink.onclick = openManageAulasSheet;
    main.appendChild(manageLink);

    var meta = document.createElement('div');
    meta.className = 'year-meta';
    meta.style.marginTop = '18px';
    meta.innerHTML = '<h2 class="display">' + escapeHtml(state.aulaSel) + '</h2><span class="cohort">Todo lo asignado a esta aula</span>';
    main.appendChild(meta);

    // recolectar todas las clases que usan esta aula, agrupadas por día
    var porDia = {};
    DIAS.forEach(function(d){ porDia[d] = []; });

    state.data.carreras.forEach(function(carrera){
      carrera.años.forEach(function(anio){
        anio.horas.forEach(function(hora){
          DIAS.forEach(function(dia){
            var key = hora.id + '_' + dia;
            var clase = anio.clases[key];
            if(clase && clase.aula === state.aulaSel){
              porDia[dia].push({
                carrera: carrera.nombre, anio: anio.nombre,
                materia: clase.materia, profesor: clase.profesor,
                inicio: hora.inicio, fin: hora.fin, label: hora.label
              });
            }
          });
        });
      });
    });

    var anyEntries = false;
    DIAS.forEach(function(dia){
      var entries = porDia[dia];
      if(!entries.length) return;
      anyEntries = true;
      entries.sort(function(a,b){ return (timeToMin(a.inicio)||0) - (timeToMin(b.inicio)||0); });

      var group = document.createElement('div');
      group.className = 'aula-day-group';
      var h3 = document.createElement('h3');
      h3.textContent = dia;
      group.appendChild(h3);

      entries.forEach(function(e, idx){
        var hasConflict = entries.some(function(other, j){
          return j !== idx && overlap(e.inicio, e.fin, other.inicio, other.fin);
        });
        var ms = materiaStyle(e.materia);
        var div = document.createElement('div');
        div.className = 'aula-entry' + (hasConflict ? ' conflict' : '');
        if(!hasConflict) div.style.borderLeft = '5px solid ' + ms.border;
        div.innerHTML =
          '<div class="avatar" style="background:' + avatarColor(e.profesor) + '; width:34px; height:34px; font-size:13px; flex-shrink:0; margin-right:2px;">' + avatarInicial(e.profesor) + '</div>' +
          '<div class="info">' +
            '<div class="time">' + e.inicio + ' – ' + e.fin + '</div>' +
            '<div class="mat" style="color:' + ms.text + '">' + escapeHtml(e.materia || '(sin materia)') + '</div>' +
            '<div class="meta">' + escapeHtml(e.carrera) + ' · ' + escapeHtml(e.anio) + (e.profesor ? ' · ' + escapeHtml(e.profesor) : '') + '</div>' +
          '</div>' +
          (hasConflict ? '<div class="warn">⚠ Superpuesto</div>' : '');
        div.style.display = 'flex';
        div.style.alignItems = 'center';
        group.appendChild(div);
      });
      main.appendChild(group);
    });

    if(!anyEntries){
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.textContent = 'Todavía no hay ninguna clase asignada a esta aula.';
      main.appendChild(empty);
    }
  }

  // ---------- Sheets ----------
  function openSheet(html, onMount){
    var backdrop = document.getElementById('backdrop');
    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '<div class="sheet-handle"></div>' + html;
    backdrop.classList.add('open');
    backdrop.onclick = function(e){ if(e.target === backdrop) closeSheet(); };
    if(onMount) onMount(sheet);
  }
  function closeSheet(){
    document.getElementById('backdrop').classList.remove('open');
  }

  function openClaseSheet(carrera, anio, hora, dia, key){
    var clase = anio.clases[key] || {materia:'', profesor:'', aula:''};
    var isEdit = !!anio.clases[key];
    var html =
      '<h3>' + dia + ' · ' + hora.label + '</h3>' +
      '<div class="sheet-sub">' + hora.inicio + ' – ' + hora.fin + ' · ' + anio.nombre + '</div>' +
      '<div class="field"><label>Materia</label><input id="f-materia" type="text" placeholder="Ej: Matemática" value="' + escapeHtml(clase.materia||'') + '"></div>' +
      '<div class="field"><label>Profesor/a</label><input id="f-profesor" type="text" placeholder="Ej: Montero" value="' + escapeHtml(clase.profesor||'') + '"></div>' +
      '<div class="field"><label>Aula</label>' + aulaSelectHtml(clase.aula||'') + '</div>' +
      '<div class="sheet-actions">' +
        (isEdit ? '<button class="btn btn-danger" id="btn-del">Borrar</button>' : '') +
        '<button class="btn btn-ghost" id="btn-cancel">Cancelar</button>' +
        '<button class="btn btn-primary" id="btn-save">Guardar</button>' +
      '</div>';
    openSheet(html, function(sheet){
      sheet.querySelector('#btn-cancel').onclick = closeSheet;
      var delBtn = sheet.querySelector('#btn-del');
      if(delBtn){
        delBtn.onclick = async function(){
          delete anio.clases[key];
          await saveData();
          closeSheet();
          render();
          toast('Clase borrada');
        };
      }
      sheet.querySelector('#btn-save').onclick = async function(){
        var materia = sheet.querySelector('#f-materia').value.trim();
        var profesor = sheet.querySelector('#f-profesor').value.trim();
        var aula = sheet.querySelector('#f-aula').value.trim();
        if(!materia && !profesor){
          delete anio.clases[key];
        }else{
          anio.clases[key] = {materia:materia, profesor:profesor, aula:aula};
        }
        var conflict = aula && hayConflictoAula(aula, dia, hora, key);
        await saveData();
        closeSheet();
        render();
        toast(conflict ? '⚠ Guardado, pero esa aula ya está ocupada a esa hora' : 'Guardado');
      };
    });
  }

  function hayConflictoAula(aula, dia, hora, ownKey){
    var found = false;
    state.data.carreras.forEach(function(carrera){
      carrera.años.forEach(function(anio2){
        anio2.horas.forEach(function(hora2){
          var key2 = hora2.id + '_' + dia;
          if(key2 === ownKey) return;
          var clase2 = anio2.clases[key2];
          if(clase2 && clase2.aula === aula && overlap(hora.inicio, hora.fin, hora2.inicio, hora2.fin)){
            found = true;
          }
        });
      });
    });
    return found;
  }

  function openManageAulasSheet(){
    var html =
      '<h3>Aulas</h3>' +
      '<div class="sheet-sub">Todavía no confirmado — podés agregar, renombrar o borrar cuando quieras.</div>' +
      '<div id="aula-list"></div>' +
      '<div class="field-row" style="margin-top:14px;">' +
        '<div class="field" style="margin-bottom:0;"><input id="f-nueva-aula" type="text" placeholder="Nombre del aula"></div>' +
        '<button class="btn btn-primary" id="btn-add-aula" style="flex:0 0 auto; padding:11px 16px;">+</button>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="btn-close">Cerrar</button>' +
      '</div>';
    openSheet(html, function(sheet){
      function renderList(){
        var listEl = sheet.querySelector('#aula-list');
        listEl.innerHTML = '';
        state.data.aulas.forEach(function(a, idx){
          var row = document.createElement('div');
          row.className = 'manage-list-item';
          row.innerHTML = '<span>' + escapeHtml(a) + '</span>';
          var del = document.createElement('button');
          del.textContent = 'Borrar';
          del.onclick = async function(){
            state.data.aulas.splice(idx,1);
            await saveData();
            renderList();
            render();
          };
          row.appendChild(del);
          listEl.appendChild(row);
        });
      }
      renderList();
      sheet.querySelector('#btn-close').onclick = function(){ closeSheet(); render(); };
      sheet.querySelector('#btn-add-aula').onclick = async function(){
        var input = sheet.querySelector('#f-nueva-aula');
        var val = input.value.trim();
        if(!val) return;
        state.data.aulas.push(val);
        input.value = '';
        await saveData();
        renderList();
        render();
      };
    });
  }

  function openNewHoraSheet(anio){
    var html =
      '<h3>Nueva franja horaria</h3>' +
      '<div class="sheet-sub">' + anio.nombre + '</div>' +
      '<div class="field"><label>Nombre (Ej: Primera, Sexta)</label><input id="f-label" type="text" placeholder="Ej: Octava"></div>' +
      '<div class="field-row">' +
        '<div class="field"><label>Inicio</label><input id="f-inicio" type="time"></div>' +
        '<div class="field"><label>Fin</label><input id="f-fin" type="time"></div>' +
      '</div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="btn-cancel">Cancelar</button>' +
        '<button class="btn btn-primary" id="btn-save">Agregar</button>' +
      '</div>';
    openSheet(html, function(sheet){
      sheet.querySelector('#btn-cancel').onclick = closeSheet;
      sheet.querySelector('#btn-save').onclick = async function(){
        var label = sheet.querySelector('#f-label').value.trim() || ('Franja ' + (anio.horas.length+1));
        var inicio = sheet.querySelector('#f-inicio').value || '--:--';
        var fin = sheet.querySelector('#f-fin').value || '--:--';
        anio.horas.push({id: uid(), label:label, inicio:inicio, fin:fin});
        await saveData();
        closeSheet();
        render();
        toast('Franja agregada');
      };
    });
  }

  function openNewAnioSheet(carrera){
    var html =
      '<h3>Nuevo año</h3>' +
      '<div class="sheet-sub">' + carrera.nombre + '</div>' +
      '<div class="field"><label>Nombre (Ej: 1° Año "B")</label><input id="f-nombre" type="text" placeholder="Ej: 1° Año &quot;B&quot;"></div>' +
      '<div class="field"><label>Cohorte</label><input id="f-cohorte" type="text" placeholder="Ej: 55/19"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="btn-cancel">Cancelar</button>' +
        '<button class="btn btn-primary" id="btn-save">Crear</button>' +
      '</div>';
    openSheet(html, function(sheet){
      sheet.querySelector('#btn-cancel').onclick = closeSheet;
      sheet.querySelector('#btn-save').onclick = async function(){
        var nombre = sheet.querySelector('#f-nombre').value.trim() || 'Nuevo año';
        var cohorte = sheet.querySelector('#f-cohorte').value.trim() || '—';
        var nuevo = {id: uid(), nombre:nombre, cohorte:cohorte, horas:[], clases:{}};
        carrera.años.push(nuevo);
        state.anioId = nuevo.id;
        await saveData();
        closeSheet();
        render();
        toast('Año creado');
      };
    });
  }

  function openNewCarreraSheet(){
    var html =
      '<h3>Nueva carrera</h3>' +
      '<div class="field"><label>Nombre</label><input id="f-nombre" type="text" placeholder="Ej: Profesorado de Inglés"></div>' +
      '<div class="sheet-actions">' +
        '<button class="btn btn-ghost" id="btn-cancel">Cancelar</button>' +
        '<button class="btn btn-primary" id="btn-save">Crear</button>' +
      '</div>';
    openSheet(html, function(sheet){
      sheet.querySelector('#btn-cancel').onclick = closeSheet;
      sheet.querySelector('#btn-save').onclick = async function(){
        var nombre = sheet.querySelector('#f-nombre').value.trim() || 'Nueva carrera';
        var nueva = {id: uid(), nombre:nombre, años:[]};
        state.data.carreras.push(nueva);
        state.carreraId = nueva.id;
        state.anioId = null;
        await saveData();
        closeSheet();
        render();
        toast('Carrera creada');
      };
    });
  }

  loadData();
})();
</script>
</body>
</html>
